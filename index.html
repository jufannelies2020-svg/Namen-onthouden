<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namen om te onthouden</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:20px;
}

h1{
  color:#ec6aa0;
  margin-bottom:5px;
}

.card{
  background:white;
  color:black;
  border-radius:25px;
  padding:20px;
  max-width:750px;
  margin:20px auto;
  min-height:500px;
}

img{
  width:100%;
  max-height:420px;
  object-fit:contain;
  border-radius:15px;
}

button{
  background:#ec6aa0;
  color:white;
  border:none;
  padding:15px 25px;
  border-radius:999px;
  font-size:18px;
  margin:6px;
}

.score{
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>Flashcards ♥</h1>
<h2>Namen om te onthouden</h2>

<div class="score" id="score">Score: 0</div>

<div class="card" id="card"></div>

<button onclick="flipCard()">Toon naam</button>
<button onclick="markCorrect()">Juist</button>
<button onclick="nextCard()">Volgende</button>

<script>

const cards = [

{
image:"IMG_7034.jpeg",
hint:"me Annelies gekust.. maar wie niet?.. ex van Fizl",
answer:"Thomas Charlier"
},

{
image:"IMG_7036.png",
hint:"Durft Magge al een voor te zwiepen.. maar wie niet?",
answer:"Kevin Wouters"
},

{
image:"IMG_7037.jpeg",
hint:"ook een Charlier maar die van Deadline",
answer:"Simon Charlier"
},

{
image:"IMG_7038.jpeg",
hint:"de Charlier van Ellen",
answer:"Dieter Charlier"
},

{
image:"IMG_7039.png",
hint:"ex van Snuifhuis",
answer:"Saki (Sander) Vangoitse… who cares"
},

{
image:"IMG_7041.png",
hint:"broer van Simon",
answer:"Ruben Charlier"
},

{
image:"IMG_7043.png",
hint:"lief van Jad",
answer:"Jan Charlier"
},

{
image:"",
hint:"een manier om dingen te onthouden waarbij je telkens vooraan een definitie of foto hebt en dan het bijhorende begrip moet noemen",
answer:"Flashcards"
}

];

let current=0;
let showingAnswer=false;
let score=0;

function renderCard(){

const card=document.getElementById("card");
const c=cards[current];

if(showingAnswer){

card.innerHTML=`
<h2>${c.answer}</h2>
`;

}else{

if(c.image){

card.innerHTML=`
<img src="${c.image}">
<h3>Hint</h3>
<p>${c.hint}</p>
`;

}else{

card.innerHTML=`
<h3>Hint</h3>
<p>${c.hint}</p>
`;

}

}

}

function flipCard(){
showingAnswer=!showingAnswer;
renderCard();
}

function markCorrect(){
score++;
document.getElementById("score").innerHTML="Score: "+score;
}

function nextCard(){

current++;

if(current>=cards.length){

alert("Eindscore: "+score+"/"+cards.length);

current=0;
score=0;

document.getElementById("score").innerHTML="Score: 0";
}

showingAnswer=false;
renderCard();
}

renderCard();

</script>

</body>
</html>
